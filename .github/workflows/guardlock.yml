name: GuardLock CI/CD

# This repo keeps one app per branch; this workflow lives on the `guardlock` branch only.
on:
  push:
    branches: [guardlock]
  pull_request:
    branches: [guardlock]
  workflow_dispatch:

# Never run two deploys of this branch at once (and never cancel one mid-flight).
concurrency:
  group: guardlock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CI (no secrets)
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # The Gradle wrapper isn't committed, so install the pinned Gradle version directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: guardlock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ---------------------------------------------------------------- CD (needs secrets)
  deploy:
    name: Deploy (rules + App Distribution)
    needs: build
    # Only real pushes to the app branch deploy. Pull requests (incl. from forks) never see secrets.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/guardlock'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets live in this GitHub *environment*. Create it under Settings > Environments.
    environment: guardlock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore secret files
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for v in GOOGLE_SERVICES_JSON_BASE64 KEYSTORE_BASE64 FIREBASE_SERVICE_ACCOUNT_JSON \
                   FIREBASE_PROJECT_ID FIREBASE_APP_ID KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v in the 'guardlock' environment"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1

          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      # Rules first, so a new APK never talks to old security rules.
      - name: Deploy Firestore rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Distribute via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ vars.TESTER_GROUPS || 'testers' }}
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message || 'Manual run' }}

      - uses: actions/upload-artifact@v4
        with:
          name: guardlock-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Remove secret files
        if: always()
        run: rm -f app/google-services.json "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/service-account.json"
